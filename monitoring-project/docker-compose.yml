version: "3.8"

services:
  # ---- PostgreSQL EXPORTER: мониторит твой локальный Postgres ----
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:maxim22s2@host.docker.internal:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - monitoring-net

  # ---- Node Exporter ----
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitoring-net

  # ---- Custom WeatherAPI Exporter ----
  custom-exporter:
    build:
      context: .
      dockerfile: Dockerfile-custom
    container_name: weather-exporter
    environment:
      WEATHER_API_KEY: "${WEATHER_API_KEY}"
      WEATHER_CITY: "${WEATHER_CITY:-Astana}"
    ports:
      - "8010:8000"
    networks:
      - monitoring-net

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - monitoring-net
    depends_on:
      - node-exporter
      - postgres-exporter
      - custom-exporter

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge
